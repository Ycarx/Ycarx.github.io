<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="icon" href="img/favicon.png">
<style>
  :root {
    --bg: #101012;
    --bar: #17171a;
    --fg: #e8e8ea;
    --dim: #8a8a92;
    --accent: #ffffff;
    --gap: 10px;
    --barh: 64px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  /* ---------- top bar ---------- */
  header {
    position: fixed;
    inset: 0 0 auto 0;
    height: var(--barh);
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 0 24px;
    background: color-mix(in srgb, var(--bar) 88%, transparent);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  header img.logo {
    height: 36px;
    width: auto;
    display: block;
  }
  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  nav a {
    color: var(--dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 6px;
    white-space: nowrap;
    transition: color .15s, background .15s;
  }
  nav a:hover { color: var(--fg); }
  nav a.active { color: var(--accent); background: #ffffff14; }
  /* ---------- galleries ---------- */
  main { padding: calc(var(--barh) + var(--gap)) var(--gap) var(--gap); }
  .view { display: none; }
  .view.active { display: block; }
  .grid { display: flex; gap: var(--gap); align-items: flex-start; }
  .grid .col { flex: 1; min-width: 0; }
  .grid .cell { margin-bottom: var(--gap); }
  .grid img, .grid video {
    display: block;
    width: 100%;
    height: auto;
    transition: transform .25s ease, opacity .25s ease;
  }
  .cell:hover img, .cell:hover video { transform: scale(1.03); }
  /* ---------- thumb-wrap: every cell (image, video or work link) clips its
     media here, rounded like a card. The optional title overlay and the
     description tab below both key off this same wrapper. ---------- */
  .thumb-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    cursor: pointer;
    background: #ffffff08;
    transition: border-radius .2s ease;
  }
  /* only square off the thumbnail's bottom corners when a description tab
     is actually present below it (cell gets .has-desc from JS) */
  .cell.has-desc:hover .thumb-wrap { border-radius: 8px 8px 0 0; }
  .video-cell .thumb-wrap, .video-cell .thumb-wrap video { background: #ffffff08; }
  /* title overlay: black 25%-alpha veil with the title, shown on hover */
  .meta-overlay {
    position: absolute;
    inset: 0;
    background: #00000040;
    display: flex;
    align-items: flex-end;
    padding: 12px;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
  }
  .cell:hover .meta-overlay { opacity: 1; }
  .meta-overlay span {
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-shadow: 0 1px 3px #000000a0;
  }
  /* the description sits in its own rounded container matching the
     thumbnail, pulled out from underneath it like a tab */
  .desc-wrap {
    height: 0;
    overflow: hidden;
    background: #ffffff08;
    border-radius: 0 0 8px 8px;
  }
  .desc {
    padding: 10px 12px 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--dim);
  }
  /* ---------- works: fixed 16:9 thumbnail box so cards line up evenly.
     Wide-enough images (video thumbnails etc.) fill it normally (cover,
     no bars). Only images too square/tall to fill without heavy cropping
     get the .letterbox modifier (added by JS once the real size is known)
     which switches to contain + black bars on the sides instead. ---------- */
  .work-card .thumb-wrap {
    aspect-ratio: 16 / 9;
  }
  .work-card .thumb-wrap img {
    height: 100%;
    object-fit: cover;
  }
  .work-card .thumb-wrap.letterbox {
    background: #000;
  }
  .work-card .thumb-wrap.letterbox img {
    object-fit: contain;
  }
  /* ---------- works: title is bold, uppercase, centered and 2x size ---------- */
  .work-card .meta-overlay {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
  }
  .work-card .meta-overlay span {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 30px;
    line-height: 1.2;
  }
  /* ---------- about ---------- */
  #about { max-width: 760px; margin: 0 auto; padding: 32px 16px; line-height: 1.7; }
  #about h1, #about h2, #about h3 { margin: 1.2em 0 .5em; line-height: 1.25; }
  #about h1:first-child, #about h2:first-child { margin-top: 0; }
  #about p, #about ul, #about ol { margin-bottom: 1em; }
  #about ul, #about ol { padding-left: 1.4em; }
  #about a { color: var(--accent); }
  #about img { max-width: 100%; border-radius: 8px; }
  #about code { background: #ffffff14; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
  #about hr { border: 0; border-top: 1px solid #ffffff1f; margin: 1.5em 0; }
  /* ---------- lightbox ---------- */
  #lightbox {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000000e0;
    z-index: 20;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img, #lightbox video {
    max-width: 94vw;
    max-height: 94vh;
    border-radius: 6px;
  }
</style>
</head>
<body>

<header>
  <a href="#portfolio"><img class="logo" src="img/logofacture.png" alt=""></a>
  <nav id="nav">
    <a href="#portfolio" data-view="portfolio">Portfolio</a>
    <a href="#animations" data-view="animations">Animations</a>
    <a href="#vfx" data-view="vfx">VFX</a>
    <a href="#ui" data-view="ui">UI</a>
    <a href="#works" data-view="works">Works</a>
    <a href="#about" data-view="about">About me</a>
  </nav>
</header>

<main>
  <section class="view" id="view-portfolio"><div class="grid"></div></section>
  <section class="view" id="view-animations"><div class="grid"></div></section>
  <section class="view" id="view-vfx"><div class="grid"></div></section>
  <section class="view" id="view-ui"><div class="grid"></div></section>
  <section class="view" id="view-works"><div class="grid" id="works-grid"></div></section>
  <section class="view" id="view-about"><div id="about"></div></section>
</main>

<div id="lightbox"></div>

<script src="manifest.js"></script>
<script>
(() => {
  const GALLERIES = ["portfolio", "animations", "vfx", "ui"];
  const mediaMeta = window.MEDIA_META || {};
  const VIDEO_RE = /\.(mp4|mov)$/i;

  /* lazy-load images: only point <img> at the real file once it's about
     to scroll into view, instead of fetching everything up front */
  const imgObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const el = en.target;
      el.src = el.dataset.src;
      el.removeAttribute("data-src");
      imgObserver.unobserve(el);
    }
  }, { rootMargin: "300px" });

  /* wraps a media element (img/video) in a thumb-wrap, and — when metadata
     is present — adds the hover title overlay and the sliding description
     tab below it. Shared by every gallery and the Works tab; only the
     Works-specific title styling differs, driven purely by CSS off the
     .work-card class. */
  /* escape text for safe HTML insertion (also used by the markdown
     renderer further down) */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* turn bare http(s) URLs inside plain text into clickable links, escaping
     everything else so the description can never inject markup */
  function linkify(text) {
    const urlRe = /https?:\/\/[^\s<>"']+/g;
    let out = "", last = 0, m;
    while ((m = urlRe.exec(text))) {
      out += esc(text.slice(last, m.index));
      const url = m[0];
      out += `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`;
      last = m.index + url.length;
    }
    out += esc(text.slice(last));
    return out;
  }

  function addMeta(cell, mediaEl, meta, onThumbClick) {
    const thumbWrap = document.createElement("div");
    thumbWrap.className = "thumb-wrap";
    thumbWrap.appendChild(mediaEl);
    if (onThumbClick) thumbWrap.addEventListener("click", onThumbClick);

    const title = (meta && meta.title) || "";
    const description = (meta && meta.description) || "";
    if (title) {
      const overlay = document.createElement("div");
      overlay.className = "meta-overlay";
      const span = document.createElement("span");
      span.textContent = title;
      overlay.appendChild(span);
      thumbWrap.appendChild(overlay);
    }
    cell.appendChild(thumbWrap);

    if (description) {
      cell.classList.add("has-desc");
      const descWrap = document.createElement("div");
      descWrap.className = "desc-wrap";
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.innerHTML = linkify(description);
      descWrap.appendChild(desc);
      cell.appendChild(descWrap);
      cell.addEventListener("mouseenter", () => animateHeight(descWrap, true));
      cell.addEventListener("mouseleave", () => animateHeight(descWrap, false));
    }
    return thumbWrap;
  }

  /* videos: generate a lightweight poster frame right away (a small ranged
     fetch for metadata + one frame, not the whole file) so a real still
     image is showing well before the user could hover — never a black
     box. The full video is only streamed and played on hover. No play
     button/overlay is shown; the static frame alone signals it's a video. */
  function makeVideoCell(src, meta) {
    const cell = document.createElement("div");
    cell.className = "cell video-cell";
    const video = document.createElement("video");
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.preload = "none";

    let posterReady = false;
    let posterCaptured = false; // true once canvas.toDataURL() actually worked
    let posterTime = 0;
    let hovering = false;

    /* pause the video back on its poster frame, releasing the file only
       when we have an actual poster image to fall back on (freeing the
       <video> of its src saves bandwidth, but under file:// canvas capture
       is blocked, so there we keep the decoded frame loaded and just
       repark the playhead — costs nothing extra on local disk) */
    function park() {
      if (posterCaptured) {
        video.removeAttribute("src");
        video.load();
        video.preload = "none";
      } else {
        video.pause();
        if (posterReady) video.currentTime = posterTime;
      }
    }

    cell._makePoster = () => {
      if (posterReady) return;
      posterReady = true;
      video.addEventListener("loadedmetadata", () => {
        posterTime = Math.min(0.5, (video.duration || 1) / 3);
        video.currentTime = posterTime;
      }, { once: true });
      video.addEventListener("seeked", () => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext("2d").drawImage(video, 0, 0);
          video.poster = canvas.toDataURL("image/jpeg", 0.7);
          posterCaptured = true;
        } catch (e) {
          /* canvas is tainted — happens when the page is opened via
             file:// instead of http(s). No data URL is possible, so the
             decoded frame itself stays on screen as the static image. */
        }
        if (!hovering) park();
      }, { once: true });
      video.preload = "metadata";
      video.src = src;
    };

    const thumbWrap = addMeta(cell, video, meta, () => openLightbox(src));
    thumbWrap.addEventListener("mouseenter", () => {
      hovering = true;
      if (!video.hasAttribute("src")) {
        video.preload = "auto";
        video.src = src;
      }
      video.play().catch(() => {});
    });
    thumbWrap.addEventListener("mouseleave", () => {
      hovering = false;
      park();
    });

    cell._makePoster();
    return cell;
  }

  /* ---- build gallery cells from manifest ---- */
  const grids = [];
  for (const cat of GALLERIES) {
    const grid = document.querySelector(`#view-${cat} .grid`);
    const cells = [];
    for (const entry of mediaMeta[cat] || []) {
      const file = entry.file;
      const src = `img/${cat}/${file}`;
      let cell;
      if (VIDEO_RE.test(file)) {
        cell = makeVideoCell(src, entry);
      } else {
        cell = document.createElement("div");
        cell.className = "cell";
        const el = document.createElement("img");
        el.dataset.src = src;
        el.alt = entry.title || "";
        el.decoding = "async";
        el.loading = "lazy";
        addMeta(cell, el, entry, () => openLightbox(src));
        imgObserver.observe(el);
      }
      cells.push(cell);
    }
    grids.push({ grid, cells });
  }

  /* ---- row-major mosaic: item order reads left to right ---- */
  const colCount = () => innerWidth <= 800 ? 2 : innerWidth <= 1100 ? 3 : 4;
  let curCols = 0;
  function layoutGrid(grid, cells, n) {
    grid.innerHTML = "";
    const cols = Array.from({ length: n }, () => {
      const col = document.createElement("div");
      col.className = "col";
      grid.appendChild(col);
      return col;
    });
    cells.forEach((cell, i) => cols[i % n].appendChild(cell));
  }
  function relayout(force) {
    const n = colCount();
    if (n === curCols && !force) return;
    curCols = n;
    for (const { grid, cells } of grids) layoutGrid(grid, cells, n);
  }
  addEventListener("resize", relayout);
  relayout();

  /* ---- lightbox ---- */
  const lightbox = document.getElementById("lightbox");
  function openLightbox(src) {
    lightbox.innerHTML = "";
    let el;
    if (VIDEO_RE.test(src)) {
      el = document.createElement("video");
      el.src = src;
      el.muted = true;
      el.loop = true;
      el.autoplay = true;
      el.controls = true;
      el.addEventListener("click", e => e.stopPropagation());
    } else {
      el = document.createElement("img");
      el.src = src;
      el.alt = "";
    }
    lightbox.appendChild(el);
    lightbox.classList.add("open");
  }
  lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
  addEventListener("keydown", e => {
    if (e.key === "Escape") lightbox.classList.remove("open");
  });

  /* ---- works ---- */
  function youtubeThumb(url) {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
    return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
  }

  /* animate an element's height between 0 and its natural content height */
  function animateHeight(wrap, open) {
    cancelAnimationFrame(wrap._raf || 0);
    const from = wrap.getBoundingClientRect().height;
    wrap.style.height = "auto";
    const to = open ? wrap.scrollHeight : 0;
    wrap.style.height = from + "px";
    const duration = 220;
    const start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      wrap.style.height = (from + (to - from) * ease(t)) + "px";
      if (t < 1) {
        wrap._raf = requestAnimationFrame(step);
      } else {
        wrap.style.height = open ? "auto" : "0px";
      }
    }
    wrap._raf = requestAnimationFrame(step);
  }

  function buildWorks(list) {
    const grid = document.getElementById("works-grid");
    const cells = [];
    for (const work of list) {
      const { title = "", description = "", url = "#" } = work;
      const thumb = work.thumbnail || youtubeThumb(url) || "";

      const card = document.createElement("div");
      card.className = "cell work-card";

      const img = document.createElement("img");
      img.dataset.src = thumb;
      img.alt = title;
      img.loading = "lazy";
      img.decoding = "async";
      imgObserver.observe(img);

      const thumbWrap = addMeta(card, img, { title, description }, () => window.open(url, "_blank", "noopener"));
      /* only letterbox thumbnails that are actually too square/tall to
         fill the 16:9 box without heavy cropping — wide ones (most video
         thumbnails) just cover it normally, no bars */
      img.addEventListener("load", () => {
        if (img.naturalWidth && img.naturalHeight && img.naturalWidth / img.naturalHeight < 1.3) {
          thumbWrap.classList.add("letterbox");
        }
      });
      cells.push(card);
    }
    /* feed into the same masonry column system as the other galleries, so
       thumbnail width matches and the description tab pushes only the
       cells below it in its own column, never the neighbouring ones */
    grids.push({ grid, cells });
    layoutGrid(grid, cells, curCols || colCount());
  }
  let worksLoaded = false;
  function loadWorks() {
    if (worksLoaded) return;
    worksLoaded = true;
    fetch("src/works.json")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(buildWorks)
      /* fetch is blocked on file:// — fall back to the copy baked into manifest.js */
      .catch(() => { if (Array.isArray(window.WORKS)) buildWorks(window.WORKS); });
  }

  /* ---- minimal markdown renderer for about me ---- */
  function inline(s) {
    return s
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function renderMarkdown(md) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    let html = "", list = null, para = [];
    const flushPara = () => {
      if (para.length) { html += `<p>${inline(para.join("<br>"))}</p>`; para = []; }
    };
    const flushList = () => {
      if (list) { html += `</${list}>`; list = null; }
    };
    for (const raw of lines) {
      const line = esc(raw);
      const h = line.match(/^(#{1,6})\s+(.*)/);
      const li = line.match(/^\s*[-*]\s+(.*)/);
      const ol = line.match(/^\s*\d+\.\s+(.*)/);
      if (h) {
        flushPara(); flushList();
        html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
      } else if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
        flushPara(); flushList();
        html += "<hr>";
      } else if (li) {
        flushPara();
        if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
        html += `<li>${inline(li[1])}</li>`;
      } else if (ol) {
        flushPara();
        if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; }
        html += `<li>${inline(ol[1])}</li>`;
      } else if (!line.trim()) {
        flushPara(); flushList();
      } else {
        flushList();
        para.push(line);
      }
    }
    flushPara(); flushList();
    return html;
  }
  let aboutLoaded = false;
  function loadAbout() {
    if (aboutLoaded) return;
    aboutLoaded = true;
    const show = md => { document.getElementById("about").innerHTML = renderMarkdown(md); };
    fetch("src/aboutme.md")
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(show)
      /* fetch is blocked on file:// — fall back to the copy baked into manifest.js */
      .catch(() => { if (typeof window.ABOUT === "string") show(window.ABOUT); });
  }

  /* ---- routing: hash -> view, portfolio is the landing view ---- */
  const links = document.querySelectorAll("#nav a");
  function route() {
    const hash = location.hash.slice(1);
    const view = [...GALLERIES, "works", "about"].includes(hash) ? hash : "portfolio";
    document.querySelectorAll(".view").forEach(v =>
      v.classList.toggle("active", v.id === `view-${view}`));
    links.forEach(a =>
      a.classList.toggle("active", a.dataset.view === view));
    if (view === "about") loadAbout();
    if (view === "works") loadWorks();
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
